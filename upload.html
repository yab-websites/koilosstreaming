<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidecut — Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110F;
    --surface:#1E1A17;
    --surface-2:#252019;
    --line:#332C24;
    --gold:#E8A33D;
    --teal:#3E8E82;
    --text:#F2EDE4;
    --muted:#8A8078;
    --red:#C1543A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(232,163,61,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--bg); }

  .wrap{ max-width:640px; margin:0 auto; padding:40px 28px 80px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:40px; border-bottom:1px solid var(--line); padding-bottom:22px;
  }
  .brand{ font-family:'Fraunces', serif; font-weight:700; font-size:26px; letter-spacing:-0.01em; }
  .brand span{ color:var(--gold); font-style:italic; font-weight:500; }
  .tagline{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted);
    letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;
  }
  .back-link{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--text); text-decoration:none;
    border:1px solid var(--line); padding:9px 16px; border-radius:7px;
    display:inline-flex; align-items:center; gap:8px;
    transition:border-color .15s, color .15s;
  }
  .back-link:hover{ border-color:var(--gold); color:var(--gold); }
  .back-link svg{ width:13px; height:13px; }

  h1.section-title{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:20px;
    margin-bottom:16px;
  }

  .field{ margin-bottom:22px; }
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--muted); margin-bottom:8px;
  }
  .folder-input-row{ display:flex; gap:10px; }
  input[type=text], select{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    font-family:'Inter', sans-serif; font-size:14px;
    padding:11px 14px; border-radius:8px; outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus, select:focus{ border-color:var(--gold); }
  select{ cursor:pointer; }
  .folder-input-row input[type=text]{ flex:1; }
  .or-chip{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted);
    align-self:center; text-transform:uppercase; letter-spacing:0.05em;
  }

  .upload-zone{
    border:1px dashed var(--line); border-radius:10px; padding:34px 20px;
    text-align:center; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .upload-zone:hover, .upload-zone.drag{ border-color:var(--gold); background:rgba(232,163,61,0.05); }
  .upload-zone svg{ width:22px; height:22px; color:var(--gold); margin-bottom:10px; }
  .upload-zone p{ font-size:13px; color:var(--muted); line-height:1.6; }
  .upload-zone strong{ color:var(--text); font-weight:500; }
  #file-input{ display:none; }

  .queue{ margin-top:24px; }
  .queue-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 12px; border-radius:8px; background:var(--surface);
    margin-bottom:8px; font-size:13.5px;
  }
  .queue-item-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .queue-item-status{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; flex-shrink:0;
  }
  .status-pending{ color:var(--muted); }
  .status-done{ color:var(--teal); }

  .toast{
    margin-top:20px; padding:14px 16px; border-radius:8px;
    background:rgba(62,142,130,0.1); border:1px solid var(--teal);
    color:var(--teal); font-size:13.5px; display:none;
  }
  .toast a{ color:var(--gold); text-decoration:none; border-bottom:1px solid rgba(232,163,61,0.4); }
</style>

<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">side<span>cut</span></div>
      <div class="tagline">add records to the shelf</div>
    </div>
    <a class="back-link" href="index.html">
      <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5m0 0 7 7m-7-7 7-7"></path></svg>
      Back to stream
    </a>
  </header>

  <h1 class="section-title">Choose a folder</h1>
  <div class="field">
    <label>Existing folder</label>
    <select id="folder-select">
      <option value="">— none yet —</option>
    </select>
  </div>
  <div class="field">
    <label>Or type a new folder name</label>
    <input type="text" id="folder-new" placeholder="e.g. Late Night Drives">
  </div>

  <h1 class="section-title">Add files</h1>
  <label class="upload-zone" id="drop-zone" for="file-input">
    <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
    <p><strong>Drop audio files here</strong><br>or click to browse — they'll upload straight into the folder above</p>
    <input type="file" id="file-input" accept="audio/*" multiple>
  </label>

  <div class="queue" id="queue"></div>
  <div class="toast" id="toast">Saved. <a href="index.html">Go stream it →</a></div>
</div>

<script>
(function(){
  const DB_NAME = 'sidecut-db', DB_VERSION = 1, STORE = 'tracks';

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)){
          const store = db.createObjectStore(STORE, { keyPath:'id', autoIncrement:true });
          store.createIndex('folder', 'folder', { unique:false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function getAllTracks(db){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function addTrack(db, track){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).add(track);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function niceName(filename){ return filename.replace(/\.[^/.]+$/, ''); }

  const folderSelect = document.getElementById('folder-select');
  const folderNew     = document.getElementById('folder-new');
  const dropZone       = document.getElementById('drop-zone');
  const fileInput        = document.getElementById('file-input');
  const queueEl            = document.getElementById('queue');
  const toast                = document.getElementById('toast');

  let db;

  async function loadFolders(){
    const all = await getAllTracks(db);
    const names = [...new Set(all.map(t => t.folder || 'Unsorted'))].sort((a,b) => a.localeCompare(b));
    folderSelect.innerHTML = '<option value="">— none yet —</option>' +
      names.map(n => `<option value="${n}">${n}</option>`).join('');
  }

  function currentFolderName(){
    const typed = folderNew.value.trim();
    if (typed) return typed;
    if (folderSelect.value) return folderSelect.value;
    return 'Unsorted';
  }

  async function handleFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith('audio/'));
    if (!files.length) return;
    const folder = currentFolderName();

    queueEl.innerHTML = '';
    const rows = files.map(f => {
      const row = document.createElement('div');
      row.className = 'queue-item';
      row.innerHTML = `
        <span class="queue-item-name">${f.name}</span>
        <span class="queue-item-status status-pending">saving…</span>
      `;
      queueEl.appendChild(row);
      return row;
    });

    for (let i = 0; i < files.length; i++){
      const file = files[i];
      await addTrack(db, {
        folder,
        name: niceName(file.name),
        blob: file,
        addedAt: Date.now()
      });
      const statusEl = rows[i].querySelector('.queue-item-status');
      statusEl.textContent = 'saved';
      statusEl.classList.remove('status-pending');
      statusEl.classList.add('status-done');
    }

    toast.style.display = 'block';
    await loadFolders();
    folderSelect.value = folder;
    folderNew.value = '';
  }

  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

  ['dragenter','dragover'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('drag'); });
  });
  dropZone.addEventListener('drop', (e) => {
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  (async function init(){
    db = await openDB();
    await loadFolders();
  })();
})();
