<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidecut — Your Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110F;
    --surface:#1E1A17;
    --surface-2:#252019;
    --line:#332C24;
    --gold:#E8A33D;
    --teal:#3E8E82;
    --text:#F2EDE4;
    --muted:#8A8078;
    --red:#C1543A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(232,163,61,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--bg); }

  /* ---- layout shell ---- */
  .wrap{
    max-width:1120px;
    margin:0 auto;
    padding:40px 28px 80px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:44px;
    border-bottom:1px solid var(--line);
    padding-bottom:22px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.01em;
  }
  .brand span{ color:var(--gold); font-style:italic; font-weight:500; }
  .tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  /* ---- main grid: player / playlist ---- */
  .stage{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:56px;
    align-items:start;
  }
  @media (max-width:760px){
    .stage{ grid-template-columns:1fr; }
  }

  /* ---- vinyl player ---- */
  .player-col{ position:sticky; top:32px; }
  .deck{
    position:relative;
    width:260px;
    height:260px;
    margin:0 auto 20px;
  }
  .platter{
    width:100%; height:100%;
    border-radius:50%;
    background:
      repeating-radial-gradient(circle at center,
        #0e0b09 0px, #0e0b09 2px,
        #1c1712 3px, #1c1712 4px);
    box-shadow:
      0 20px 50px -18px rgba(0,0,0,0.7),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    display:flex; align-items:center; justify-content:center;
    animation:spin 6s linear infinite;
    animation-play-state:paused;
  }
  .platter.playing{ animation-play-state:running; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .label{
    width:96px; height:96px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--gold), #c47f1f);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.25);
  }
  .label::after{
    content:'';
    width:10px; height:10px;
    border-radius:50%;
    background:var(--bg);
    margin-top:6px;
  }
  .label-title{
    font-family:'Fraunces', serif;
    font-weight:600; font-size:11px;
    color:#241704;
    text-align:center;
    padding:0 10px;
    line-height:1.2;
    max-height:34px;
    overflow:hidden;
  }
  .tonearm{
    position:absolute;
    top:-14px; right:-6px;
    width:110px; height:110px;
    transform-origin:100% 0%;
    transform:rotate(-18deg);
    transition:transform 0.5s cubic-bezier(.4,1.4,.4,1);
    pointer-events:none;
  }
  .tonearm.playing{ transform:rotate(2deg); }
  .tonearm svg{ width:100%; height:100%; }

  .now-playing{
    text-align:center;
    margin-bottom:18px;
  }
  .np-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    line-height:1.25;
  }
  .np-empty{ color:var(--muted); font-size:14px; }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:16px;
  }
  .ctl-btn{
    background:none; border:none; color:var(--text);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0.85;
    transition:opacity .15s, transform .15s;
  }
  .ctl-btn:hover{ opacity:1; transform:translateY(-1px); }
  .ctl-btn:disabled{ opacity:0.25; cursor:not-allowed; transform:none; }
  .play-btn{
    width:52px; height:52px;
    border-radius:50%;
    background:var(--gold);
    color:var(--bg);
  }
  .play-btn:hover{ opacity:1; }
  .play-btn svg{ width:20px; height:20px; }
  .skip-btn svg{ width:20px; height:20px; }

  .seek-row{
    display:flex; align-items:center; gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--muted);
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:3px;
    background:var(--line);
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px; height:11px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    box-shadow:0 0 0 3px rgba(232,163,61,0.18);
  }
  #seek{ }
  .vol-row{
    display:flex; align-items:center; gap:8px;
    margin-top:14px;
  }
  .vol-row svg{ width:15px; height:15px; color:var(--muted); flex-shrink:0; }
  #vol{ max-width:110px; margin:0 auto; }
  .vol-row{ justify-content:center; }

  /* ---- upload ---- */
  .upload-zone{
    border:1px dashed var(--line);
    border-radius:10px;
    padding:20px;
    text-align:center;
    margin-top:26px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .upload-zone:hover, .upload-zone.drag{
    border-color:var(--gold);
    background:rgba(232,163,61,0.05);
  }
  .upload-zone svg{ width:20px; height:20px; color:var(--gold); margin-bottom:8px; }
  .upload-zone p{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .upload-zone strong{ color:var(--text); font-weight:500; }
  #file-input{ display:none; }

  /* ---- tracklist ---- */
  .tracklist-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .tracklist-head h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:20px;
  }
  .track-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
  }
  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .empty-state svg{ width:28px; height:28px; margin-bottom:12px; opacity:0.6; }
  .empty-state p{ font-size:13.5px; line-height:1.6; }

  .track{
    display:grid;
    grid-template-columns:34px 1fr auto 32px;
    align-items:center;
    gap:14px;
    padding:13px 10px;
    border-radius:8px;
    cursor:pointer;
    transition:background .12s;
  }
  .track:hover{ background:var(--surface); }
  .track.active{ background:var(--surface-2); }
  .track-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  .track.active .track-num{ color:var(--gold); }
  .track-eq{ display:none; }
  .track.active .track-eq{
    display:flex; align-items:flex-end; gap:2px;
    height:14px; width:14px; margin:0 auto;
  }
  .track.active .track-num{ display:none; }
  .track-eq span{
    width:2.5px; background:var(--gold);
    animation:eq 0.9s ease-in-out infinite;
  }
  .track-eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .track-eq span:nth-child(2){ height:100%; animation-delay:.2s; }
  .track-eq span:nth-child(3){ height:65%; animation-delay:.4s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(0.4);} 50%{ transform:scaleY(1);} }

  .track-info{ min-width:0; }
  .track-name{
    font-size:14.5px;
    font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .track-dur{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
  }
  .track-remove{
    background:none; border:none;
    color:var(--muted);
    cursor:pointer;
    width:28px; height:28px;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition:opacity .12s, color .12s, background .12s;
  }
  .track:hover .track-remove{ opacity:1; }
  .track-remove:hover{ color:var(--red); background:rgba(193,84,58,0.1); }
  .track-remove svg{ width:14px; height:14px; }
</style>
<style type="text/css" nonce="">
.redacted {
  color: red !important;
}</style></head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">side<span>cut</span></div>
      <div class="tagline">a small player for your own files</div>
    </div>
  </header>

  <div class="stage">
    <!-- PLAYER -->
    <div class="player-col">
      <div class="deck">
        <div class="platter" id="platter">
          <div class="label">
            <div class="label-title" id="label-title">Sidecut</div>
          </div>
        </div>
        <div class="tonearm" id="tonearm">
          <svg viewbox="0 0 110 110" fill="none">
            <circle cx="96" cy="14" r="9" fill="#252019" stroke="#332C24"></circle>
            <line x1="96" y1="14" x2="34" y2="78" stroke="#8A8078" stroke-width="3" stroke-linecap="round"></line>
            <circle cx="34" cy="78" r="4" fill="#E8A33D"></circle>
          </svg>
        </div>
      </div>

      <div class="now-playing">
        <div class="np-title" id="np-title">
          <span class="np-empty">Nothing loaded yet</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctl-btn skip-btn" id="prev-btn" disabled title="Previous">
          <svg viewbox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path></svg>
        </button>
        <button class="ctl-btn play-btn" id="play-btn" disabled title="Play">
          <svg id="play-icon" viewbox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <button class="ctl-btn skip-btn" id="next-btn" disabled title="Next">
          <svg viewbox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"></path></svg>
        </button>
      </div>

      <div class="seek-row">
        <span id="cur-time">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" disabled>
        <span id="dur-time">0:00</span>
      </div>

      <div class="vol-row">
        <svg viewbox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12z"></path></svg>
        <input type="range" id="vol" min="0" max="100" value="80">
      </div>

      <label class="upload-zone" id="drop-zone" for="file-input">
        <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
        <p><strong>Add a track</strong><br>drop an audio file here, or click to browse</p>
        <input type="file" id="file-input" accept="audio/*" multiple>
      </label>
    </div>

    <!-- TRACKLIST -->
    <div class="list-col">
      <div class="tracklist-head">
        <h2>Side A</h2>
        <span class="track-count" id="track-count">0 tracks</span>
      </div>

      <div id="empty-state" class="empty-state">
        <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="margin:0 auto 12px; display:block;"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 8.5v7l6-3.5z" fill="currentColor" stroke="none"></path></svg>
        <p>Your record shelf is empty.<br>Upload a few audio files on the left to start playing.</p>
      </div>

      <div id="track-list"></div>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
(function(){
  const fileInput   = document.getElementById('file-input');
  const dropZone     = document.getElementById('drop-zone');
  const trackListEl  = document.getElementById('track-list');
  const emptyState   = document.getElementById('empty-state');
  const trackCountEl = document.getElementById('track-count');
  const audio        = document.getElementById('audio');
  const playBtn       = document.getElementById('play-btn');
  const playIcon       = document.getElementById('play-icon');
  const prevBtn        = document.getElementById('prev-btn');
  const nextBtn        = document.getElementById('next-btn');
  const seek            = document.getElementById('seek');
  const curTimeEl        = document.getElementById('cur-time');
  const durTimeEl        = document.getElementById('dur-time');
  const volSlider          = document.getElementById('vol');
  const platter             = document.getElementById('platter');
  const tonearm              = document.getElementById('tonearm');
  const npTitle                = document.getElementById('np-title');
  const labelTitle               = document.getElementById('label-title');

  const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

  let tracks = [];       // { id, name, url, duration }
  let currentIndex = -1;
  let isPlaying = false;

  audio.volume = volSlider.value / 100;

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function niceName(filename){
    return filename.replace(/\.[^/.]+$/, '');
  }

  function render(){
    trackCountEl.textContent = tracks.length === 1 ? '1 track' : `${tracks.length} tracks`;
    emptyState.style.display = tracks.length ? 'none' : 'block';
    trackListEl.innerHTML = '';

    tracks.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'track' + (i === currentIndex ? ' active' : '');
      row.innerHTML = `
        <span class="track-num">${(i+1).toString().padStart(2,'0')}</span>
        <span class="track-eq"><span></span><span></span><span></span></span>
        <span class="track-info">
          <div class="track-name">${t.name}</div>
          <div class="track-meta">local file</div>
        </span>
        <span class="track-dur">${t.duration ? fmtTime(t.duration) : '--:--'}</span>
        <button class="track-remove" title="Remove" data-idx="${i}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M9 6V4h6v2m-8 0 1 14h10l1-14"/></svg>
        </button>
      `;
      row.addEventListener('click', (e) => {
        if (e.target.closest('.track-remove')) return;
        playTrackAt(i);
      });
      row.querySelector('.track-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrackAt(i);
      });
      trackListEl.appendChild(row);
    });
  }

  function addFiles(fileList){
    Array.from(fileList).forEach(file => {
      if (!file.type.startsWith('audio/')) return;
      const url = URL.createObjectURL(file);
      const track = { name: niceName(file.name), url, duration: null };
      tracks.push(track);

      // probe duration quietly
      const probe = new Audio();
      probe.preload = 'metadata';
      probe.src = url;
      probe.addEventListener('loadedmetadata', () => {
        track.duration = probe.duration;
        render();
      });
    });
    render();
    if (currentIndex === -1 && tracks.length){
      loadTrackAt(0, false);
    }
    playBtn.disabled = tracks.length === 0;
    updateSkipButtons();
  }

  function updateSkipButtons(){
    prevBtn.disabled = tracks.length < 2;
    nextBtn.disabled = tracks.length < 2;
  }

  function loadTrackAt(i, autoplay){
    if (i < 0 || i >= tracks.length) return;
    currentIndex = i;
    const t = tracks[i];
    audio.src = t.url;
    npTitle.innerHTML = t.name;
    labelTitle.textContent = t.name;
    seek.disabled = false;
    render();
    if (autoplay){
      audio.play();
    }
  }

  function playTrackAt(i){
    if (i === currentIndex){
      togglePlay();
      return;
    }
    loadTrackAt(i, true);
  }

  function removeTrackAt(i){
    const wasCurrent = i === currentIndex;
    URL.revokeObjectURL(tracks[i].url);
    tracks.splice(i, 1);

    if (tracks.length === 0){
      currentIndex = -1;
      audio.pause();
      audio.removeAttribute('src');
      isPlaying = false;
      setPlayIcon();
      npTitle.innerHTML = '<span class="np-empty">Nothing loaded yet</span>';
      labelTitle.textContent = 'Sidecut';
      playBtn.disabled = true;
      seek.disabled = true;
      seek.value = 0;
      curTimeEl.textContent = '0:00';
      durTimeEl.textContent = '0:00';
    } else if (wasCurrent){
      loadTrackAt(Math.min(i, tracks.length - 1), true);
    } else if (i < currentIndex){
      currentIndex -= 1;
    }
    updateSkipButtons();
    render();
  }

  function setPlayIcon(){
    playIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    platter.classList.toggle('playing', isPlaying);
    tonearm.classList.toggle('playing', isPlaying);
  }

  function togglePlay(){
    if (currentIndex === -1) return;
    if (audio.paused){ audio.play(); } else { audio.pause(); }
  }

  audio.addEventListener('play', () => { isPlaying = true; setPlayIcon(); });
  audio.addEventListener('pause', () => { isPlaying = false; setPlayIcon(); });
  audio.addEventListener('ended', () => {
    if (currentIndex < tracks.length - 1){
      loadTrackAt(currentIndex + 1, true);
    } else {
      isPlaying = false; setPlayIcon();
    }
  });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    seek.value = (audio.currentTime / audio.duration) * 100;
    curTimeEl.textContent = fmtTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => {
    durTimeEl.textContent = fmtTime(audio.duration);
  });

  playBtn.addEventListener('click', togglePlay);
  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) loadTrackAt(currentIndex - 1, true);
    else loadTrackAt(tracks.length - 1, true);
  });
  nextBtn.addEventListener('click', () => {
    if (currentIndex < tracks.length - 1) loadTrackAt(currentIndex + 1, true);
    else loadTrackAt(0, true);
  });
  seek.addEventListener('input', () => {
    if (!audio.duration) return;
    audio.currentTime = (seek.value / 100) * audio.duration;
  });
  volSlider.addEventListener('input', () => {
    audio.volume = volSlider.value / 100;
  });

  fileInput.addEventListener('change', (e) => addFiles(e.target.files));

  ['dragenter','dragover'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropZone.classList.add('drag');
    });
  });
  ['dragleave','drop'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropZone.classList.remove('drag');
    });
  });
  dropZone.addEventListener('drop', (e) => {
    if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
